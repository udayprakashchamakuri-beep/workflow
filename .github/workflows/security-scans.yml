name: Security Scans

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep scan
        run: semgrep scan --config auto --error --json --output semgrep-report.json .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 14

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: "v0.68.1"

      - name: Generate Trivy JSON report
        run: >
          trivy fs
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --format json
          --output trivy-report.json
          --exit-code 0
          .

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 14

      - name: Fail on high or critical vulnerabilities
        run: >
          trivy fs
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --format table
          --exit-code 1
          .
